<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | CleanKarachi</title>

    <link rel="stylesheet" href="style_register.css">
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">CleanKarachi</a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="complaints.html">Complaints</a>
            <a href="login.html">Login</a>
            <a href="register.html" class="nav-button">Register</a>
        </nav>
    </header>

    <main class="register-page">
        

        <section class="register-card">

            <h1>Create Your Account</h1>

            <p class="register-intro">
                Join CleanKarachi and help keep your area clean.
            </p>

            <div id="form-message" role="status" aria-live="polite"></div>

            <form id="register-form">

                <div id="success-message" class="success-message">
                    Registration successful!
                </div>

                <div class="form-group">
                    <label for="full_name">Full Name</label>

                    <input type="text" id="full_name" name="full_name" placeholder="Enter your full name"
                        autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input type="password" id="password" name="password" placeholder="Create a password"
                        autocomplete="new-password" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>

                    <input type="password" id="confirm_password" name="confirm_password"
                        placeholder="Re-enter your password" autocomplete="new-password" required>
                </div>

                <button type="submit" class="register-submit">
                    Create Account
                </button>

            </form>

            <p class="login-prompt">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </section>

    </main>

    <footer class="footer">

        <div class="footer-content">

            <div class="footer-brand">
                <a href="index.html" class="footer-logo">
                    CleanKarachi
                </a>

                <p>Waste Pickup & Garbage Complaint System</p>
            </div>

            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="complaints.html">Complaints</a>
                <a href="login.html">Login</a>
            </div>

        </div>

        <div class="footer-bottom">
            <p>&copy; 2026 CleanKarachi. All rights reserved.</p>
        </div>

    </footer>

    <script src="auth.js"></script>

</body>

</html>
